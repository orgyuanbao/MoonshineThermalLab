name: Offline software and mathematical checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thermal:
    name: Moonshine thermal ROM / Windows x64 / n=24
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: MoonshineThermalLab
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: MoonshineThermalLab/requirements-science.txt
      - name: Install pinned dependencies and verify original Moonshine tools offline
        run: python -B -X utf8 setup_environment.py
      - name: Recompute the frozen n=24 experiment (repetition 1)
        run: .\.venv\Scripts\python.exe -B -X utf8 reproduce_thermal.py
      - name: Check the replay report against the frozen workload
        run: |
          $reports = @(Get-ChildItem -Path 'thermal/reproductions/*/reproduction_report.json' -File)
          if ($reports.Count -ne 1) { throw "Expected one report, found $($reports.Count)." }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw -Encoding utf8 | ConvertFrom-Json
          if ($report.status -ne 'passed' -or $report.original_workspace_unchanged -ne $true -or
              $report.model_calls -ne 0 -or $report.new_test_parameters_generated -ne $false -or
              $report.runs.Count -ne 1) { throw 'The replay or preservation checks failed.' }
          $run = $report.runs[0]
          # 256 queries x (3 errors x 5 methods + 6 adaptive decisions).
          if ($run.n -ne 24 -or $run.repeat -ne 1 -or $run.returncode -ne 0 -or $run.checks -ne 5376 -or
              $null -eq $run.largest_error_statistic_difference -or
              -not [double]::IsFinite($run.largest_error_statistic_difference) -or
              $run.largest_error_statistic_difference -gt 1e-9) { throw 'Unexpected workload or numerical discrepancy.' }
          "Thermal ROM: n=24, repetition 1, $($run.checks) comparisons, largest absolute difference $($run.largest_error_statistic_difference), zero model calls." >> $env:GITHUB_STEP_SUMMARY
      - name: Audit exact rational enclosures and the four-cell counterexample
        run: .\.venv\Scripts\python.exe -B -X utf8 residual_study/exact_audit.py
      - name: Replay five residual bounds on all 256 frozen n=24 queries
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "thermal-residual-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          .\.venv\Scripts\python.exe -B -X utf8 residual_study/run_experiment.py --grids 24 --queries 256 --repeats 1 --check-against residual_study/results --output $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $summary = Get-Content -Raw -Encoding utf8 -LiteralPath (Join-Path $destination 'summary.json') | ConvertFrom-Json
          $paired = $summary.reproduction_comparison.'paired_cases.csv'
          $closed = $summary.reproduction_comparison.'closed_loop_cases.csv'
          if ($summary.status -ne 'passed' -or $paired.rows -ne 512 -or $closed.rows -ne 1280) {
            throw 'Unexpected residual-study output or row counts.'
          }
          "Residual bounds: 256 frozen queries, $($paired.rows) paired predictions and $($closed.rows) closed-loop rows checked against published results." >> $env:GITHUB_STEP_SUMMARY
      - name: Verify decisions on the additional 128-query n=48 stream
        run: .\.venv\Scripts\python.exe -B -X utf8 residual_study/fresh_stream.py
      - name: Replay the original Moonshine signed-residual research programs
        run: .\.venv\Scripts\python.exe -B -X utf8 residual_study/moonshine/replay.py
      - name: Save the signed-residual replay results
        uses: actions/upload-artifact@v4
        with:
          name: signed-residual-n24-replay
          path: ${{ runner.temp }}/thermal-residual-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Save the thermal replay report and solver logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermal-rom-n24-replay
          path: |
            MoonshineThermalLab/thermal/reproductions/*/reproduction_report.json
            MoonshineThermalLab/thermal/reproductions/*/n24-repeat1.*.txt
          if-no-files-found: warn

  tests:
    name: CrowdLocate archive / Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Check local numeric prerequisites
        run: python doctor.py --json
      - name: Test isolated fixtures without models or research datasets
        run: python -m unittest discover -s tests -v
      - name: Test unchanged Creative-Intelligence controller without models
        # Original Windows label fixtures get an explicit platform context; native labels are also checked.
        run: python -B integrations/creative_intelligence/run_vendor_tests.py
      - name: Test Creative-Intelligence integration without models
        run: python -B -m unittest discover -s integrations/creative_intelligence/tests -v
      - name: Reproduce Creative-Intelligence study without models
        run: python -B studies/creative_intelligence/mirror_ambiguity/reproduce_checks.py
      - name: Verify preserved first-study evidence without model calls
        run: python audit.py --run runs/live_reference --require-frozen
      - name: Verify preserved revision evidence without model calls
        run: python audit.py --run runs/revision_reference --require-frozen
      - name: Recompute saved statistics without fitting or new data
        run: python verification/check_revision_results.py
      - name: Build audited evidence archives from both preserved studies
        run: |
          python research_archive.py --run runs/live_reference --output archives/ci_live
          python research_archive.py --run runs/revision_reference --output archives/ci_revision
